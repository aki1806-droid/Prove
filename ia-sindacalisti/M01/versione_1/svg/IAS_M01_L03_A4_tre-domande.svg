<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&amp;family=Inter:wght@400;600&amp;family=Barlow+Condensed:wght@700&amp;display=swap');
text{font-family:Inter,sans-serif} .t{font-family:Montserrat,sans-serif;font-weight:800} .n{font-family:'Barlow Condensed',sans-serif;font-weight:700}
@keyframes traccia{to{stroke-dashoffset:0}} @keyframes pop{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes appare{to{opacity:1}} @keyframes sale{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}} @keyframes svanisce{to{opacity:.15}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:traccia var(--d,1.4s) cubic-bezier(.65,0,.25,1) var(--t,0s) forwards}
.pp{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.ap{opacity:0;animation:appare .6s var(--t,0s) forwards} .sl{opacity:0;animation:sale .7s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.cr{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:cresce 1s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.sv{animation:svanisce .8s var(--t,0s) forwards}
</style>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" fill="#E6F2EC"/><text x="160" y="150" class="t ap" font-size="56" fill="#2B2F2E" style="--t:.1s">Le tre domande</text><text x="160" y="270" class="t ap" font-size="40" fill="#2B2F2E" style="--t:0.4s">Comunicato settimanale</text><g class="sl" style="--t:0.8s"><rect x="160" y="330" width="760" height="110" rx="16" fill="#fff" stroke="#2B2F2E" stroke-opacity=".12" stroke-width="3"/><text x="196" y="398" font-size="34" font-weight="600" fill="#2B2F2E">Si ripete spesso?</text></g><g class="pp" style="--t:1.1s"><circle cx="850" cy="385" r="34" fill="#00623A"/><path d="M834 385 l12 12 l22 -24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><g class="sl" style="--t:1.4s"><rect x="160" y="480" width="760" height="110" rx="16" fill="#fff" stroke="#2B2F2E" stroke-opacity=".12" stroke-width="3"/><text x="196" y="548" font-size="34" font-weight="600" fill="#2B2F2E">La fatica è nella forma?</text></g><g class="pp" style="--t:1.8s"><circle cx="850" cy="535" r="34" fill="#00623A"/><path d="M834 535 l12 12 l22 -24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><g class="sl" style="--t:2.0s"><rect x="160" y="630" width="760" height="110" rx="16" fill="#fff" stroke="#2B2F2E" stroke-opacity=".12" stroke-width="3"/><text x="196" y="698" font-size="34" font-weight="600" fill="#2B2F2E">Un errore lo vedrei rileggendo?</text></g><g class="pp" style="--t:2.4s"><circle cx="850" cy="685" r="34" fill="#00623A"/><path d="M834 685 l12 12 l22 -24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><g class="pp" style="--t:2.8s"><rect x="160" y="800" width="760" height="100" rx="50" fill="#00623A"/><text x="540" y="864" text-anchor="middle" class="t" font-size="40" fill="#fff">Candidato ideale</text></g><text x="1000" y="270" class="t ap" font-size="40" fill="#2B2F2E" style="--t:3.4s">Arretrati di un lavoratore</text><g class="sl" style="--t:3.8s"><rect x="1000" y="330" width="760" height="110" rx="16" fill="#fff" stroke="#2B2F2E" stroke-opacity=".12" stroke-width="3"/><text x="1036" y="398" font-size="34" font-weight="600" fill="#2B2F2E">Si ripete spesso?</text></g><g class="pp" style="--t:4.1s"><circle cx="1690" cy="385" r="34" fill="#D70328"/><path d="M1676 371 l28 28 M1704 371 l-28 28" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g><g class="sl" style="--t:4.4s"><rect x="1000" y="480" width="760" height="110" rx="16" fill="#fff" stroke="#2B2F2E" stroke-opacity=".12" stroke-width="3"/><text x="1036" y="548" font-size="34" font-weight="600" fill="#2B2F2E">La fatica è nella forma?</text></g><g class="pp" style="--t:4.7s"><circle cx="1690" cy="535" r="34" fill="#D70328"/><path d="M1676 521 l28 28 M1704 521 l-28 28" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g><g class="sl" style="--t:5.0s"><rect x="1000" y="630" width="760" height="110" rx="16" fill="#fff" stroke="#2B2F2E" stroke-opacity=".12" stroke-width="3"/><text x="1036" y="698" font-size="34" font-weight="600" fill="#2B2F2E">Un errore lo vedrei rileggendo?</text></g><g class="pp" style="--t:5.3s"><circle cx="1690" cy="685" r="34" fill="#D70328"/><path d="M1676 671 l28 28 M1704 671 l-28 28" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g><g class="pp" style="--t:5.8s"><rect x="1000" y="800" width="760" height="100" rx="50" fill="#D70328"/><text x="1380" y="864" text-anchor="middle" class="t" font-size="40" fill="#fff">Con molta cautela</text></g><rect width="1920" height="1080" filter="url(#g)" opacity=".08" style="mix-blend-mode:multiply"/></svg>