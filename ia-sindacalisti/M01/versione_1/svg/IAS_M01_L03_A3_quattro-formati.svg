<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&amp;family=Inter:wght@400;600&amp;family=Barlow+Condensed:wght@700&amp;display=swap');
text{font-family:Inter,sans-serif} .t{font-family:Montserrat,sans-serif;font-weight:800} .n{font-family:'Barlow Condensed',sans-serif;font-weight:700}
@keyframes traccia{to{stroke-dashoffset:0}} @keyframes pop{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes appare{to{opacity:1}} @keyframes sale{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}} @keyframes svanisce{to{opacity:.15}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:traccia var(--d,1.4s) cubic-bezier(.65,0,.25,1) var(--t,0s) forwards}
.pp{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.ap{opacity:0;animation:appare .6s var(--t,0s) forwards} .sl{opacity:0;animation:sale .7s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.cr{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:cresce 1s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.sv{animation:svanisce .8s var(--t,0s) forwards}
</style>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" fill="#0B3D2A"/><text x="160" y="150" class="t ap" font-size="56" fill="#fff" style="--t:.1s">Un testo, quattro formati</text><g class="sl" style="--t:.3s"><rect x="200" y="330" width="380" height="480" rx="18" fill="#FAF8F4"/><text x="240" y="400" class="t" font-size="34" fill="#2B2F2E">Comunicato</text><rect x="240" y="440" width="300" height="16" rx="8" fill="#2B2F2E" fill-opacity=".3"/><rect x="240" y="484" width="280" height="16" rx="8" fill="#2B2F2E" fill-opacity=".3"/><rect x="240" y="528" width="310" height="16" rx="8" fill="#2B2F2E" fill-opacity=".3"/><rect x="240" y="572" width="250" height="16" rx="8" fill="#2B2F2E" fill-opacity=".3"/><rect x="240" y="616" width="290" height="16" rx="8" fill="#2B2F2E" fill-opacity=".3"/><rect x="240" y="660" width="200" height="16" rx="8" fill="#2B2F2E" fill-opacity=".3"/><rect x="240" y="704" width="260" height="16" rx="8" fill="#2B2F2E" fill-opacity=".3"/><rect x="240" y="748" width="180" height="16" rx="8" fill="#2B2F2E" fill-opacity=".3"/></g><path d="M580 570 C760 570 760 250 960 250" pathLength="1" class="dr" fill="none" stroke="#00623A" stroke-width="6" style="--t:1.2s;--d:.7s"/><g class="sl" style="--t:1.7s"><rect x="980" y="180" width="740" height="140" rx="18" fill="#fff"/><rect x="980" y="180" width="16" height="140" rx="8" fill="#00623A"/><text x="1030" y="240" class="t" font-size="38" fill="#2B2F2E">Messaggio WhatsApp</text><rect x="1030" y="266" width="220" height="12" rx="6" fill="#2B2F2E" fill-opacity=".25"/></g><path d="M580 570 C760 570 760 450 960 450" pathLength="1" class="dr" fill="none" stroke="#1F5C7A" stroke-width="6" style="--t:1.8s;--d:.7s"/><g class="sl" style="--t:2.3s"><rect x="980" y="380" width="740" height="140" rx="18" fill="#fff"/><rect x="980" y="380" width="16" height="140" rx="8" fill="#1F5C7A"/><text x="1030" y="440" class="t" font-size="38" fill="#2B2F2E">Mail agli iscritti</text><rect x="1030" y="466" width="480" height="12" rx="6" fill="#2B2F2E" fill-opacity=".25"/><rect x="1030" y="492" width="420" height="12" rx="6" fill="#2B2F2E" fill-opacity=".25"/></g><path d="M580 570 C760 570 760 650 960 650" pathLength="1" class="dr" fill="none" stroke="#E8A33D" stroke-width="6" style="--t:2.4s;--d:.7s"/><g class="sl" style="--t:2.9s"><rect x="980" y="580" width="740" height="140" rx="18" fill="#fff"/><rect x="980" y="580" width="16" height="140" rx="8" fill="#E8A33D"/><text x="1030" y="640" class="t" font-size="38" fill="#2B2F2E">Post Facebook</text><rect x="1030" y="666" width="360" height="12" rx="6" fill="#2B2F2E" fill-opacity=".25"/><rect x="1030" y="692" width="300" height="12" rx="6" fill="#2B2F2E" fill-opacity=".25"/></g><path d="M580 570 C760 570 760 850 960 850" pathLength="1" class="dr" fill="none" stroke="#D70328" stroke-width="6" style="--t:3.0s;--d:.7s"/><g class="sl" style="--t:3.5s"><rect x="980" y="780" width="740" height="140" rx="18" fill="#fff"/><rect x="980" y="780" width="16" height="140" rx="8" fill="#D70328"/><text x="1030" y="840" class="t" font-size="38" fill="#2B2F2E">Assemblea, 30″</text><rect x="1030" y="866" width="540" height="12" rx="6" fill="#2B2F2E" fill-opacity=".25"/></g><rect width="1920" height="1080" filter="url(#g)" opacity=".08" style="mix-blend-mode:multiply"/></svg>