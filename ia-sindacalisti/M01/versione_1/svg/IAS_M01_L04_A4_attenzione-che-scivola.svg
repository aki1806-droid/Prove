<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&amp;family=Inter:wght@400;600&amp;family=Barlow+Condensed:wght@700&amp;display=swap');
text{font-family:Inter,sans-serif} .t{font-family:Montserrat,sans-serif;font-weight:800} .n{font-family:'Barlow Condensed',sans-serif;font-weight:700}
@keyframes traccia{to{stroke-dashoffset:0}} @keyframes pop{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes appare{to{opacity:1}} @keyframes sale{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}} @keyframes svanisce{to{opacity:.15}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:traccia var(--d,1.4s) cubic-bezier(.65,0,.25,1) var(--t,0s) forwards}
.pp{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.ap{opacity:0;animation:appare .6s var(--t,0s) forwards} .sl{opacity:0;animation:sale .7s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.cr{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:cresce 1s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.sv{animation:svanisce .8s var(--t,0s) forwards}
</style>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" fill="#FAF8F4"/><text x="160" y="150" class="t ap" font-size="56" fill="#2B2F2E" style="--t:.1s">L'attenzione che scivola</text><path d="M260 900 V260 M260 900 H1700" pathLength="1" class="dr" stroke="#2B2F2E" stroke-width="5" fill="none" style="--t:.2s;--d:.8s"/><text x="240" y="280" text-anchor="end" font-size="26" font-weight="600" fill="#2B2F2E" class="ap" style="--t:.6s">Attenzione</text><text x="1700" y="950" text-anchor="end" font-size="26" font-weight="600" fill="#2B2F2E" class="ap" style="--t:.6s">Volte in cui è andata bene</text><path d="M260 320 L332 400 L404 467 L476 525 L548 573 L620 614 L692 649 L764 678 L836 703 L908 724 L980 742 L1052 757 L1124 770 L1196 780 L1268 790 L1340 797 L1412 804 L1484 809 L1556 814 L1628 818 L1700 821" pathLength="1" class="dr" fill="none" stroke="#D70328" stroke-width="10" stroke-linecap="round" style="--t:1s;--d:3s"/><path d="M260 330 H1700" pathLength="1" class="dr" fill="none" stroke="#00623A" stroke-width="8" stroke-dasharray="1" style="--t:4.4s;--d:1.4s"/><text x="1690" y="310" text-anchor="end" class="t ap" font-size="34" fill="#00623A" style="--t:5.4s">Con il secondo sguardo</text><text x="1690" y="780" text-anchor="end" class="t ap" font-size="34" fill="#D70328" style="--t:3.8s">Senza</text><text x="1700" y="1010" text-anchor="end" font-size="24" fill="#2B2F2E" opacity=".6" class="ap" style="--t:5.8s">Andamento illustrativo</text><rect width="1920" height="1080" filter="url(#g)" opacity=".08" style="mix-blend-mode:multiply"/></svg>