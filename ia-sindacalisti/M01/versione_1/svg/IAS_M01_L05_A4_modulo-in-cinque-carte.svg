<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&amp;family=Inter:wght@400;600&amp;family=Barlow+Condensed:wght@700&amp;display=swap');
text{font-family:Inter,sans-serif} .t{font-family:Montserrat,sans-serif;font-weight:800} .n{font-family:'Barlow Condensed',sans-serif;font-weight:700}
@keyframes traccia{to{stroke-dashoffset:0}} @keyframes pop{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes appare{to{opacity:1}} @keyframes sale{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}} @keyframes svanisce{to{opacity:.15}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:traccia var(--d,1.4s) cubic-bezier(.65,0,.25,1) var(--t,0s) forwards}
.pp{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.ap{opacity:0;animation:appare .6s var(--t,0s) forwards} .sl{opacity:0;animation:sale .7s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.cr{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:cresce 1s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.sv{animation:svanisce .8s var(--t,0s) forwards}
</style>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" fill="#E6F2EC"/><text x="160" y="150" class="t ap" font-size="56" fill="#2B2F2E" style="--t:.1s">Il modulo 1 in cinque carte</text><g class="sl" style="--t:0.4s"><rect x="160" y="260" width="500" height="320" rx="22" fill="#fff" stroke="#00623A" stroke-opacity=".25" stroke-width="3"/><text x="200" y="360" class="n" font-size="80" fill="#00623A">1.1</text><text x="200" y="450" class="t" font-size="40" fill="#2B2F2E">Prevede parole</text><text x="200" y="510" font-size="28" fill="#2B2F2E" opacity=".7">non consulta archivi</text></g><g class="sl" style="--t:0.9s"><rect x="700" y="260" width="500" height="320" rx="22" fill="#fff" stroke="#00623A" stroke-opacity=".25" stroke-width="3"/><text x="740" y="360" class="n" font-size="80" fill="#00623A">1.2</text><text x="740" y="450" class="t" font-size="40" fill="#2B2F2E">Probabile ≠ vero</text><text x="740" y="510" font-size="28" fill="#2B2F2E" opacity=".7">cinque zone a rischio</text></g><g class="sl" style="--t:1.4s"><rect x="1240" y="260" width="500" height="320" rx="22" fill="#fff" stroke="#00623A" stroke-opacity=".25" stroke-width="3"/><text x="1280" y="360" class="n" font-size="80" fill="#00623A">1.3</text><text x="1280" y="450" class="t" font-size="40" fill="#2B2F2E">Otto famiglie</text><text x="1280" y="510" font-size="28" fill="#2B2F2E" opacity=".7">la forma a lei</text></g><g class="sl" style="--t:1.9s"><rect x="430" y="630" width="500" height="320" rx="22" fill="#fff" stroke="#00623A" stroke-opacity=".25" stroke-width="3"/><text x="470" y="730" class="n" font-size="80" fill="#00623A">1.4</text><text x="470" y="820" class="t" font-size="40" fill="#2B2F2E">Tre linee rosse</text><text x="470" y="880" font-size="28" fill="#2B2F2E" opacity=".7">decidere, firmare, giudicare</text></g><g class="sl" style="--t:2.4s"><rect x="970" y="630" width="500" height="320" rx="22" fill="#fff" stroke="#00623A" stroke-opacity=".25" stroke-width="3"/><text x="1010" y="730" class="n" font-size="80" fill="#00623A">1.5</text><text x="1010" y="820" class="t" font-size="40" fill="#2B2F2E">Sette passi</text><text x="1010" y="880" font-size="28" fill="#2B2F2E" opacity=".7">una conversazione guidata</text></g><rect width="1920" height="1080" filter="url(#g)" opacity=".08" style="mix-blend-mode:multiply"/></svg>