<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&amp;family=Inter:wght@400;600&amp;family=Barlow+Condensed:wght@700&amp;display=swap');
text{font-family:Inter,sans-serif} .t{font-family:Montserrat,sans-serif;font-weight:800} .n{font-family:'Barlow Condensed',sans-serif;font-weight:700}
@keyframes traccia{to{stroke-dashoffset:0}} @keyframes pop{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes appare{to{opacity:1}} @keyframes sale{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}} @keyframes svanisce{to{opacity:.15}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:traccia var(--d,1.4s) cubic-bezier(.65,0,.25,1) var(--t,0s) forwards}
.pp{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.ap{opacity:0;animation:appare .6s var(--t,0s) forwards} .sl{opacity:0;animation:sale .7s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.cr{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:cresce 1s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.sv{animation:svanisce .8s var(--t,0s) forwards}
</style>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" fill="#0B3D2A"/><text x="160" y="150" class="t ap" font-size="56" fill="#fff" style="--t:.1s">Il semaforo</text><rect x="200" y="230" width="260" height="760" rx="60" fill="#111a17" class="sl" style="--t:.2s"/><circle cx="330" cy="360" r="95" fill="#D70328" fill-opacity=".15"/><circle cx="330" cy="360" r="95" fill="#D70328" class="pp" style="--t:0.6s"/><text x="560" y="300" class="t ap" font-size="40" fill="#D70328" style="--t:0.7s">Rosso</text><text x="560" y="360" font-size="30" font-weight="600" fill="#fff" class="ap" style="--t:0.9s">Decisioni · Firme senza rilettura · Giudizi sulle persone</text><text x="560" y="406" font-size="30" font-weight="600" fill="#fff" class="ap" style="--t:1.1s">Dati sensibili · Risposte a chi soffre</text><circle cx="330" cy="610" r="95" fill="#E8A33D" fill-opacity=".15"/><circle cx="330" cy="610" r="95" fill="#E8A33D" class="pp" style="--t:1.9s"/><text x="560" y="550" class="t ap" font-size="40" fill="#E8A33D" style="--t:2.0s">Giallo</text><text x="560" y="610" font-size="30" font-weight="600" fill="#fff" class="ap" style="--t:2.2s">Analisi di documenti · Opzioni per decidere · Cronologie anonime</text><circle cx="330" cy="860" r="95" fill="#2BB673" fill-opacity=".15"/><circle cx="330" cy="860" r="95" fill="#2BB673" class="pp" style="--t:3.2s"/><text x="560" y="800" class="t ap" font-size="40" fill="#2BB673" style="--t:3.3s">Verde</text><text x="560" y="860" font-size="30" font-weight="600" fill="#fff" class="ap" style="--t:3.5s">Bozze · Riassunti e riordino · Traduzioni</text><text x="560" y="906" font-size="30" font-weight="600" fill="#fff" class="ap" style="--t:3.7s">Materiali formativi</text><rect width="1920" height="1080" filter="url(#g)" opacity=".08" style="mix-blend-mode:multiply"/></svg>