<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&amp;family=Inter:wght@400;600&amp;family=Barlow+Condensed:wght@700&amp;display=swap');
text{font-family:Inter,sans-serif} .t{font-family:Montserrat,sans-serif;font-weight:800} .n{font-family:'Barlow Condensed',sans-serif;font-weight:700}
@keyframes traccia{to{stroke-dashoffset:0}} @keyframes pop{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes appare{to{opacity:1}} @keyframes sale{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}} @keyframes svanisce{to{opacity:.15}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:traccia var(--d,1.4s) cubic-bezier(.65,0,.25,1) var(--t,0s) forwards}
.pp{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.ap{opacity:0;animation:appare .6s var(--t,0s) forwards} .sl{opacity:0;animation:sale .7s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.cr{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:cresce 1s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.sv{animation:svanisce .8s var(--t,0s) forwards}
</style>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" fill="#FAF8F4"/><text x="160" y="150" class="t ap" font-size="56" fill="#2B2F2E" style="--t:.1s">Da dove cominciare</text><rect x="300" y="230" width="640" height="340" fill="#00623A" fill-opacity=".14" class="ap" style="--t:.5s"/><rect x="940" y="570" width="640" height="340" fill="#D70328" fill-opacity=".10" class="ap" style="--t:.5s"/><path d="M300 910 V230" pathLength="1" class="dr" stroke="#2B2F2E" stroke-width="6" style="--t:.2s;--d:.8s"/><path d="M300 910 H1580" pathLength="1" class="dr" stroke="#2B2F2E" stroke-width="6" style="--t:.2s;--d:.8s"/><text x="270" y="250" text-anchor="end" font-size="28" font-weight="600" fill="#2B2F2E" class="ap" style="--t:.8s">Spesso</text><text x="270" y="905" text-anchor="end" font-size="28" font-weight="600" fill="#2B2F2E" class="ap" style="--t:.8s">Di rado</text><text x="310" y="960" font-size="28" font-weight="600" fill="#2B2F2E" class="ap" style="--t:.8s">Errore innocuo</text><text x="1580" y="960" text-anchor="end" font-size="28" font-weight="600" fill="#2B2F2E" class="ap" style="--t:.8s">Errore grave</text><text x="330" y="280" class="t ap" font-size="34" fill="#00623A" style="--t:1s">Comincia da qui</text><text x="1550" y="890" text-anchor="end" class="t ap" font-size="34" fill="#D70328" style="--t:1s">Solo come aiuto</text><g class="pp" style="--t:1.40s"><rect x="330" y="310" width="434" height="62" rx="31" fill="#fff" stroke="#00623A" stroke-width="4"/><text x="547" y="351" text-anchor="middle" font-size="28" font-weight="600" fill="#2B2F2E">Comunicato settimanale</text></g><g class="pp" style="--t:1.75s"><rect x="330" y="400" width="383" height="62" rx="31" fill="#fff" stroke="#00623A" stroke-width="4"/><text x="522" y="441" text-anchor="middle" font-size="28" font-weight="600" fill="#2B2F2E">Verbale di riunione</text></g><g class="pp" style="--t:2.10s"><rect x="720" y="400" width="230" height="62" rx="31" fill="#fff" stroke="#1F5C7A" stroke-width="4"/><text x="835" y="441" text-anchor="middle" font-size="28" font-weight="600" fill="#2B2F2E">Traduzione</text></g><g class="pp" style="--t:2.45s"><rect x="480" y="490" width="315" height="62" rx="31" fill="#fff" stroke="#1F5C7A" stroke-width="4"/><text x="638" y="531" text-anchor="middle" font-size="28" font-weight="600" fill="#2B2F2E">Avviso spiegato</text></g><g class="pp" style="--t:2.80s"><rect x="560" y="640" width="366" height="62" rx="31" fill="#fff" stroke="#1F5C7A" stroke-width="4"/><text x="743" y="681" text-anchor="middle" font-size="28" font-weight="600" fill="#2B2F2E">Scaletta assemblea</text></g><g class="pp" style="--t:3.15s"><rect x="1000" y="650" width="213" height="62" rx="31" fill="#fff" stroke="#D70328" stroke-width="4"/><text x="1106" y="691" text-anchor="middle" font-size="28" font-weight="600" fill="#2B2F2E">Arretrati</text></g><g class="pp" style="--t:3.50s"><rect x="1300" y="750" width="179" height="62" rx="31" fill="#fff" stroke="#D70328" stroke-width="4"/><text x="1390" y="791" text-anchor="middle" font-size="28" font-weight="600" fill="#2B2F2E">Diffida</text></g><g class="pp" style="--t:4.2s"><rect x="1360" y="300" width="420" height="80" rx="40" fill="#D70328"/><text x="1570" y="352" text-anchor="middle" class="t" font-size="30" fill="#fff">Decisione politica ✕</text></g><text x="1570" y="420" text-anchor="middle" font-size="26" fill="#D70328" class="ap" style="--t:4.5s">fuori dalla matrice</text><rect width="1920" height="1080" filter="url(#g)" opacity=".08" style="mix-blend-mode:multiply"/></svg>