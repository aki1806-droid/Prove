<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&amp;family=Inter:wght@400;600&amp;family=Barlow+Condensed:wght@700&amp;display=swap');
text{font-family:Inter,sans-serif} .t{font-family:Montserrat,sans-serif;font-weight:800} .n{font-family:'Barlow Condensed',sans-serif;font-weight:700}
@keyframes traccia{to{stroke-dashoffset:0}} @keyframes pop{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes appare{to{opacity:1}} @keyframes sale{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}} @keyframes svanisce{to{opacity:.15}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:traccia var(--d,1.4s) cubic-bezier(.65,0,.25,1) var(--t,0s) forwards}
.pp{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.ap{opacity:0;animation:appare .6s var(--t,0s) forwards} .sl{opacity:0;animation:sale .7s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.cr{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:cresce 1s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.sv{animation:svanisce .8s var(--t,0s) forwards}
</style>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" fill="#0B3D2A"/><text x="160" y="150" class="t ap" font-size="56" fill="#fff" style="--t:.1s">Tre linee rosse</text><path d="M160 600 H1760" pathLength="1" class="dr" stroke="#fff" stroke-opacity=".25" stroke-width="6" stroke-dasharray="1" style="--t:.3s;--d:1s"/><rect x="600" y="300" width="36" height="600" rx="18" fill="#D70328" class="pp" style="--t:0.8s"/><text x="618" y="270" text-anchor="middle" class="t ap" font-size="44" fill="#fff" style="--t:1.0s">Decidere</text><text x="618" y="960" text-anchor="middle" font-size="28" fill="#fff" opacity=".7" class="ap" style="--t:1.1s">vertenze, accordi, priorità</text><rect x="1070" y="300" width="36" height="600" rx="18" fill="#D70328" class="pp" style="--t:1.5s"/><text x="1088" y="270" text-anchor="middle" class="t ap" font-size="44" fill="#fff" style="--t:1.7s">Firmare</text><text x="1088" y="960" text-anchor="middle" font-size="28" fill="#fff" opacity=".7" class="ap" style="--t:1.8s">ciò che esce dalla sede</text><rect x="1540" y="300" width="36" height="600" rx="18" fill="#D70328" class="pp" style="--t:2.2s"/><text x="1558" y="270" text-anchor="middle" class="t ap" font-size="44" fill="#fff" style="--t:2.4s">Giudicare</text><text x="1558" y="960" text-anchor="middle" font-size="28" fill="#fff" opacity=".7" class="ap" style="--t:2.5s">le persone e le loro storie</text><g class="sl" style="--t:3.2s"><rect x="160" y="545" width="200" height="110" rx="18" fill="#FAF8F4"/><text x="260" y="613" text-anchor="middle" class="t" font-size="30" fill="#2B2F2E">Proposta</text></g><path d="M370 600 H580" pathLength="1" class="dr" stroke="#E8A33D" stroke-width="10" stroke-linecap="round" style="--t:3.7s;--d:.4s"/><text x="160" y="720" font-size="28" font-weight="600" fill="#E8A33D" class="ap" style="--t:4.2s">Qui si ferma la macchina</text><rect width="1920" height="1080" filter="url(#g)" opacity=".08" style="mix-blend-mode:multiply"/></svg>