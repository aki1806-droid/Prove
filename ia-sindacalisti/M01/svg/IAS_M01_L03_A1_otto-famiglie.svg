<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&amp;family=Inter:wght@400;600&amp;family=Barlow+Condensed:wght@700&amp;display=swap');
text{font-family:Inter,sans-serif} .t{font-family:Montserrat,sans-serif;font-weight:800} .n{font-family:'Barlow Condensed',sans-serif;font-weight:700}
@keyframes traccia{to{stroke-dashoffset:0}} @keyframes pop{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes appare{to{opacity:1}} @keyframes sale{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}} @keyframes svanisce{to{opacity:.15}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:traccia var(--d,1.4s) cubic-bezier(.65,0,.25,1) var(--t,0s) forwards}
.pp{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.ap{opacity:0;animation:appare .6s var(--t,0s) forwards} .sl{opacity:0;animation:sale .7s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.cr{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:cresce 1s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.sv{animation:svanisce .8s var(--t,0s) forwards}
</style>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" fill="#E6F2EC"/><text x="160" y="150" class="t ap" font-size="56" fill="#2B2F2E" style="--t:.1s">Otto famiglie di compiti</text><path d="M969 300 A350 350 0 0 1 1201 396 L1070 534 A160 160 0 0 0 964 490Z" fill="#00623A" fill-opacity="0.85" class="pp" style="--t:0.40s"/><text x="1121" y="274" text-anchor="start" class="t ap" font-size="36" fill="#2B2F2E" style="--t:0.60s">Scrivere</text><path d="M1214 409 A350 350 0 0 1 1310 641 L1120 646 A160 160 0 0 0 1076 540Z" fill="#1F5C7A" fill-opacity="0.85" class="pp" style="--t:0.65s"/><text x="1348" y="501" text-anchor="start" class="t ap" font-size="36" fill="#2B2F2E" style="--t:0.85s">Leggere</text><path d="M1310 659 A350 350 0 0 1 1214 891 L1076 760 A160 160 0 0 0 1120 654Z" fill="#1D2B53" fill-opacity="0.85" class="pp" style="--t:0.90s"/><text x="1348" y="823" text-anchor="start" class="t ap" font-size="36" fill="#2B2F2E" style="--t:1.10s">Preparare</text><path d="M1201 904 A350 350 0 0 1 969 1000 L964 810 A160 160 0 0 0 1070 766Z" fill="#00623A" fill-opacity="0.85" class="pp" style="--t:1.15s"/><text x="1121" y="1050" text-anchor="start" class="t ap" font-size="36" fill="#2B2F2E" style="--t:1.35s">Ordinare</text><path d="M951 1000 A350 350 0 0 1 719 904 L850 766 A160 160 0 0 0 956 810Z" fill="#1F5C7A" fill-opacity="0.85" class="pp" style="--t:1.40s"/><text x="799" y="1050" text-anchor="end" class="t ap" font-size="36" fill="#2B2F2E" style="--t:1.60s">Spiegare semplice</text><path d="M706 891 A350 350 0 0 1 610 659 L800 654 A160 160 0 0 0 844 760Z" fill="#1D2B53" fill-opacity="0.85" class="pp" style="--t:1.65s"/><text x="572" y="823" text-anchor="end" class="t ap" font-size="36" fill="#2B2F2E" style="--t:1.85s">Tradurre</text><path d="M610 641 A350 350 0 0 1 706 409 L844 540 A160 160 0 0 0 800 646Z" fill="#E8A33D" fill-opacity="1" class="pp" style="--t:1.90s"/><text x="572" y="501" text-anchor="end" class="t ap" font-size="36" fill="#2B2F2E" style="--t:2.10s">Immagini</text><path d="M719 396 A350 350 0 0 1 951 300 L956 490 A160 160 0 0 0 850 534Z" fill="#00623A" fill-opacity="0.85" class="pp" style="--t:2.15s"/><text x="799" y="274" text-anchor="end" class="t ap" font-size="36" fill="#2B2F2E" style="--t:2.35s">Formare</text><circle cx="960" cy="650" r="144" fill="#FAF8F4" class="pp" style="--t:2.6s"/><text x="960" y="640" text-anchor="middle" class="t ap" font-size="30" fill="#2B2F2E" style="--t:2.9s">Il contenuto</text><text x="960" y="682" text-anchor="middle" class="t ap" font-size="30" fill="#00623A" style="--t:3.1s">lo porti tu</text><rect width="1920" height="1080" filter="url(#g)" opacity=".08" style="mix-blend-mode:multiply"/></svg>