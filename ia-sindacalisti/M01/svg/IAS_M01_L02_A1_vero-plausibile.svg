<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&amp;family=Inter:wght@400;600&amp;family=Barlow+Condensed:wght@700&amp;display=swap');
text{font-family:Inter,sans-serif} .t{font-family:Montserrat,sans-serif;font-weight:800} .n{font-family:'Barlow Condensed',sans-serif;font-weight:700}
@keyframes traccia{to{stroke-dashoffset:0}} @keyframes pop{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes appare{to{opacity:1}} @keyframes sale{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}} @keyframes svanisce{to{opacity:.15}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:traccia var(--d,1.4s) cubic-bezier(.65,0,.25,1) var(--t,0s) forwards}
.pp{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.ap{opacity:0;animation:appare .6s var(--t,0s) forwards} .sl{opacity:0;animation:sale .7s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.cr{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:cresce 1s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.sv{animation:svanisce .8s var(--t,0s) forwards}
</style>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" fill="#E6F2EC"/><text x="160" y="170" class="t ap" font-size="56" fill="#2B2F2E" style="--t:.1s">Vero e plausibile</text><circle cx="780" cy="590" r="330" fill="#00623A" fill-opacity=".18" stroke="#00623A" stroke-width="8" class="pp" style="--t:.4s"/><circle cx="1140" cy="590" r="330" fill="#1F5C7A" fill-opacity=".18" stroke="#1F5C7A" stroke-width="8" class="pp" style="--t:.9s"/><text x="640" y="420" text-anchor="middle" class="t ap" font-size="44" fill="#00623A" style="--t:1.2s">Vero</text><text x="1290" y="420" text-anchor="middle" class="t ap" font-size="44" fill="#1F5C7A" style="--t:1.5s">Plausibile</text><text x="960" y="600" text-anchor="middle" class="t ap" font-size="38" fill="#2B2F2E" style="--t:2.2s">Affidabile</text><text x="610" y="610" text-anchor="middle" font-size="30" font-weight="600" fill="#2B2F2E" class="ap" style="--t:3.0s">Vero ma raro</text><g class="pp" style="--t:3.6s"><rect x="1190" y="560" width="300" height="76" rx="38" fill="#D70328"/><text x="1340" y="610" text-anchor="middle" class="t" font-size="32" fill="#fff">Errore sicuro</text></g><rect width="1920" height="1080" filter="url(#g)" opacity=".08" style="mix-blend-mode:multiply"/></svg>