<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&amp;family=Inter:wght@400;600&amp;family=Barlow+Condensed:wght@700&amp;display=swap');
text{font-family:Inter,sans-serif} .t{font-family:Montserrat,sans-serif;font-weight:800} .n{font-family:'Barlow Condensed',sans-serif;font-weight:700}
@keyframes traccia{to{stroke-dashoffset:0}} @keyframes pop{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes appare{to{opacity:1}} @keyframes sale{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}} @keyframes svanisce{to{opacity:.15}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:traccia var(--d,1.4s) cubic-bezier(.65,0,.25,1) var(--t,0s) forwards}
.pp{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.ap{opacity:0;animation:appare .6s var(--t,0s) forwards} .sl{opacity:0;animation:sale .7s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.cr{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:cresce 1s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.sv{animation:svanisce .8s var(--t,0s) forwards}
</style>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" fill="#FAF8F4"/><text x="160" y="170" class="t ap" font-size="56" fill="#2B2F2E" style="--t:.1s">La parola successiva</text><text x="160" y="300" class="t ap" font-size="58" fill="#2B2F2E" style="--t:.4s">Il lavoratore che ha fatto il turno di notte</text><text x="160" y="380" class="t ap" font-size="58" fill="#2B2F2E" style="--t:.8s">ha diritto a un</text><rect x="640" y="334" width="6" height="58" fill="#00623A" opacity="0"><animate attributeName="opacity" values="1;0;1;0;1;0" dur="3s" begin="1.2s" fill="freeze"/></rect><text x="160" y="550" font-size="44" font-weight="600" fill="#2B2F2E" class="ap" style="--t:1.60s">riposo</text><rect x="460" y="510" width="900" height="54" rx="10" fill="#00623A" class="cr" style="--t:1.70s"/><text x="160" y="660" font-size="44" font-weight="600" fill="#2B2F2E" class="ap" style="--t:1.95s">permesso</text><rect x="460" y="620" width="420" height="54" rx="10" fill="#1F5C7A" class="cr" style="--t:2.05s"/><text x="160" y="770" font-size="44" font-weight="600" fill="#2B2F2E" class="ap" style="--t:2.30s">indennità</text><rect x="460" y="730" width="300" height="54" rx="10" fill="#1F5C7A" class="cr" style="--t:2.40s"/><text x="160" y="880" font-size="44" font-weight="600" fill="#2B2F2E" class="ap" style="--t:2.65s">ombrello</text><rect x="460" y="840" width="14" height="54" rx="10" fill="#D70328" class="cr" style="--t:2.75s"/><rect x="440" y="500" width="980" height="96" rx="14" fill="none" stroke="#00623A" stroke-width="5" class="ap" style="--t:3.6s"/><text x="660" y="380" class="t pp" font-size="58" fill="#00623A" style="--t:4.3s">riposo</text><text x="1760" y="1010" text-anchor="end" font-size="26" fill="#2B2F2E" opacity=".6" class="ap" style="--t:4.6s">Probabilità illustrative</text><rect width="1920" height="1080" filter="url(#g)" opacity=".08" style="mix-blend-mode:multiply"/></svg>