<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&amp;family=Inter:wght@400;600&amp;family=Barlow+Condensed:wght@700&amp;display=swap');
text{font-family:Inter,sans-serif} .t{font-family:Montserrat,sans-serif;font-weight:800} .n{font-family:'Barlow Condensed',sans-serif;font-weight:700}
@keyframes traccia{to{stroke-dashoffset:0}} @keyframes pop{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes appare{to{opacity:1}} @keyframes sale{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}} @keyframes svanisce{to{opacity:.15}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:traccia var(--d,1.4s) cubic-bezier(.65,0,.25,1) var(--t,0s) forwards}
.pp{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.ap{opacity:0;animation:appare .6s var(--t,0s) forwards} .sl{opacity:0;animation:sale .7s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.cr{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:cresce 1s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.sv{animation:svanisce .8s var(--t,0s) forwards}
</style>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" fill="#0B3D2A"/><text x="160" y="170" class="t ap" font-size="56" fill="#fff" style="--t:.1s">Dove sbaglia più spesso</text><g class="sl" style="--t:0.50s"><text x="160" y="310" class="n" font-size="72" fill="#E8A33D">1</text><text x="260" y="300" class="t" font-size="40" fill="#fff">Riferimenti precisi</text><text x="260" y="344" font-size="28" fill="#fff" opacity=".65">articoli, commi, date</text></g><rect x="1000" y="288" width="760" height="30" rx="15" fill="#fff" fill-opacity=".1" class="ap" style="--t:0.50s"/><rect x="1000" y="288" width="684" height="30" rx="15" fill="#D70328" class="cr" style="--t:0.80s"/><g class="sl" style="--t:0.95s"><text x="160" y="460" class="n" font-size="72" fill="#E8A33D">2</text><text x="260" y="450" class="t" font-size="40" fill="#fff">Testi locali</text><text x="260" y="494" font-size="28" fill="#fff" opacity=".65">accordi, regolamenti</text></g><rect x="1000" y="438" width="760" height="30" rx="15" fill="#fff" fill-opacity=".1" class="ap" style="--t:0.95s"/><rect x="1000" y="438" width="646" height="30" rx="15" fill="#D70328" class="cr" style="--t:1.25s"/><g class="sl" style="--t:1.40s"><text x="160" y="610" class="n" font-size="72" fill="#E8A33D">3</text><text x="260" y="600" class="t" font-size="40" fill="#fff">Cose che si somigliano</text><text x="260" y="644" font-size="28" fill="#fff" opacity=".65">comparti, versioni</text></g><rect x="1000" y="588" width="760" height="30" rx="15" fill="#fff" fill-opacity=".1" class="ap" style="--t:1.40s"/><rect x="1000" y="588" width="532" height="30" rx="15" fill="#D70328" class="cr" style="--t:1.70s"/><g class="sl" style="--t:1.85s"><text x="160" y="760" class="n" font-size="72" fill="#E8A33D">4</text><text x="260" y="750" class="t" font-size="40" fill="#fff">Attualità</text><text x="260" y="794" font-size="28" fill="#fff" opacity=".65">novità recenti</text></g><rect x="1000" y="738" width="760" height="30" rx="15" fill="#fff" fill-opacity=".1" class="ap" style="--t:1.85s"/><rect x="1000" y="738" width="570" height="30" rx="15" fill="#D70328" class="cr" style="--t:2.15s"/><g class="sl" style="--t:2.30s"><text x="160" y="910" class="n" font-size="72" fill="#E8A33D">5</text><text x="260" y="900" class="t" font-size="40" fill="#fff">Calcoli</text><text x="260" y="944" font-size="28" fill="#fff" opacity=".65">arretrati, percentuali</text></g><rect x="1000" y="888" width="760" height="30" rx="15" fill="#fff" fill-opacity=".1" class="ap" style="--t:2.30s"/><rect x="1000" y="888" width="456" height="30" rx="15" fill="#D70328" class="cr" style="--t:2.60s"/><text x="1760" y="1040" text-anchor="end" font-size="26" fill="#fff" opacity=".55" class="ap" style="--t:3s">Rischio relativo, illustrativo</text><rect width="1920" height="1080" filter="url(#g)" opacity=".08" style="mix-blend-mode:multiply"/></svg>