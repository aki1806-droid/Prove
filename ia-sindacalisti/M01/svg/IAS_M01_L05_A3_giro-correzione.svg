<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&amp;family=Inter:wght@400;600&amp;family=Barlow+Condensed:wght@700&amp;display=swap');
text{font-family:Inter,sans-serif} .t{font-family:Montserrat,sans-serif;font-weight:800} .n{font-family:'Barlow Condensed',sans-serif;font-weight:700}
@keyframes traccia{to{stroke-dashoffset:0}} @keyframes pop{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes appare{to{opacity:1}} @keyframes sale{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}} @keyframes svanisce{to{opacity:.15}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:traccia var(--d,1.4s) cubic-bezier(.65,0,.25,1) var(--t,0s) forwards}
.pp{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.ap{opacity:0;animation:appare .6s var(--t,0s) forwards} .sl{opacity:0;animation:sale .7s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.cr{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:cresce 1s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.sv{animation:svanisce .8s var(--t,0s) forwards}
</style>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" fill="#0B3D2A"/><text x="160" y="150" class="t ap" font-size="56" fill="#fff" style="--t:.1s">Il giro di correzione</text><circle cx="960" cy="600" r="300" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="10"/><circle cx="960" cy="600" r="300" fill="none" stroke="#E8A33D" stroke-width="10" pathLength="1" class="dr" transform="rotate(-90 960 600)" style="--t:.6s;--d:4s"/><circle cx="960" cy="300" r="40" fill="#00623A" class="pp" style="--t:0.6s"/><text x="960" y="230" text-anchor="middle" class="t ap" font-size="40" fill="#fff" style="--t:0.8s">Chiedi</text><circle cx="1260" cy="600" r="40" fill="#1F5C7A" class="pp" style="--t:1.6s"/><text x="1340" y="612" text-anchor="start" class="t ap" font-size="40" fill="#fff" style="--t:1.8s">Leggi</text><circle cx="960" cy="900" r="40" fill="#D70328" class="pp" style="--t:2.6s"/><text x="960" y="995" text-anchor="middle" class="t ap" font-size="40" fill="#fff" style="--t:2.8s">Correggi con la fonte</text><circle cx="660" cy="600" r="40" fill="#E8A33D" class="pp" style="--t:3.6s"/><text x="580" y="612" text-anchor="end" class="t ap" font-size="40" fill="#fff" style="--t:3.8s">Riformula</text><text x="960" y="590" text-anchor="middle" font-size="30" fill="#fff" opacity=".7" class="ap" style="--t:4.8s">un punto</text><text x="960" y="634" text-anchor="middle" font-size="30" fill="#fff" opacity=".7" class="ap" style="--t:4.9s">alla volta</text><rect width="1920" height="1080" filter="url(#g)" opacity=".08" style="mix-blend-mode:multiply"/></svg>