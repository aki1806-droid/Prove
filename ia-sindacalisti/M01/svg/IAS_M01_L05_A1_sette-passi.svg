<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&amp;family=Inter:wght@400;600&amp;family=Barlow+Condensed:wght@700&amp;display=swap');
text{font-family:Inter,sans-serif} .t{font-family:Montserrat,sans-serif;font-weight:800} .n{font-family:'Barlow Condensed',sans-serif;font-weight:700}
@keyframes traccia{to{stroke-dashoffset:0}} @keyframes pop{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes appare{to{opacity:1}} @keyframes sale{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}} @keyframes svanisce{to{opacity:.15}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:traccia var(--d,1.4s) cubic-bezier(.65,0,.25,1) var(--t,0s) forwards}
.pp{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.ap{opacity:0;animation:appare .6s var(--t,0s) forwards} .sl{opacity:0;animation:sale .7s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.cr{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:cresce 1s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.sv{animation:svanisce .8s var(--t,0s) forwards}
</style>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" fill="#FAF8F4"/><text x="160" y="150" class="t ap" font-size="56" fill="#2B2F2E" style="--t:.1s">I sette passi</text><path d="M260 420 L620 420 L980 420 L1340 420 L1660 600 L1340 800 L980 800" pathLength="1" class="dr" fill="none" stroke="#00623A" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" style="--t:.3s;--d:3.4s"/><g class="pp" style="--t:0.40s"><circle cx="260" cy="420" r="52" fill="#FAF8F4" stroke="#00623A" stroke-width="12"/><text x="260" y="438" text-anchor="middle" class="n" font-size="54" fill="#2B2F2E">1</text></g><text x="260" y="330" text-anchor="middle" class="t ap" font-size="32" fill="#2B2F2E" style="--t:0.55s">Conversazione nuova</text><g class="pp" style="--t:0.88s"><circle cx="620" cy="420" r="52" fill="#FAF8F4" stroke="#00623A" stroke-width="12"/><text x="620" y="438" text-anchor="middle" class="n" font-size="54" fill="#2B2F2E">2</text></g><text x="620" y="330" text-anchor="middle" class="t ap" font-size="32" fill="#2B2F2E" style="--t:1.03s">Contesto</text><g class="pp" style="--t:1.36s"><circle cx="980" cy="420" r="52" fill="#FAF8F4" stroke="#00623A" stroke-width="12"/><text x="980" y="438" text-anchor="middle" class="n" font-size="54" fill="#2B2F2E">3</text></g><text x="980" y="330" text-anchor="middle" class="t ap" font-size="32" fill="#2B2F2E" style="--t:1.51s">Domanda</text><g class="pp" style="--t:1.84s"><circle cx="1340" cy="420" r="52" fill="#FAF8F4" stroke="#D70328" stroke-width="12"/><text x="1340" y="438" text-anchor="middle" class="n" font-size="54" fill="#2B2F2E">4</text></g><text x="1340" y="330" text-anchor="middle" class="t ap" font-size="32" fill="#2B2F2E" style="--t:1.99s">Lettura da esperto</text><g class="pp" style="--t:2.32s"><circle cx="1660" cy="600" r="52" fill="#FAF8F4" stroke="#00623A" stroke-width="12"/><text x="1660" y="618" text-anchor="middle" class="n" font-size="54" fill="#2B2F2E">5</text></g><text x="1580" y="610" text-anchor="end" class="t ap" font-size="32" fill="#2B2F2E" style="--t:2.47s">Correzione con fonte</text><g class="pp" style="--t:2.80s"><circle cx="1340" cy="800" r="52" fill="#FAF8F4" stroke="#00623A" stroke-width="12"/><text x="1340" y="818" text-anchor="middle" class="n" font-size="54" fill="#2B2F2E">6</text></g><text x="1340" y="920" text-anchor="middle" class="t ap" font-size="32" fill="#2B2F2E" style="--t:2.95s">Nuova forma</text><g class="pp" style="--t:3.28s"><circle cx="980" cy="800" r="52" fill="#FAF8F4" stroke="#00623A" stroke-width="12"/><text x="980" y="818" text-anchor="middle" class="n" font-size="54" fill="#2B2F2E">7</text></g><text x="980" y="920" text-anchor="middle" class="t ap" font-size="32" fill="#2B2F2E" style="--t:3.43s">Verifica finale</text><text x="1340" y="262" text-anchor="middle" font-size="26" font-weight="600" fill="#D70328" class="ap" style="--t:2.4s">il passo più importante</text><rect width="1920" height="1080" filter="url(#g)" opacity=".08" style="mix-blend-mode:multiply"/></svg>