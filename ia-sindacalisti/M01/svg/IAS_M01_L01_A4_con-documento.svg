="12" rx="6" fill="#2B2F2E" opacity=".35"/><rect x="1075" y="582" width="180" height="12" rx="6" fill="#2B2F2E" opacity=".35"/><rect x="1075" y="618" width="120" height="12" rx="6" fill="#2B2F2E" opacity=".35"/><rect x="1075" y="654" width="160" height="12" rx="6" fill="#2B2F2E" opacity=".35"/><rect x="1075" y="690" width="140" height="12" rx="6" fill="#2B2F2E" opacity=".35"/><rect x="1075" y="726" width="170" height="12" rx="6" fill="#2B2F2E" opacity=".35"/></g><rect x="1068" y="618" width="196" height="28" rx="6" fill="#E8A33D" fill-opacity=".55" class="ap" style="--t:3.6s"/><rect x="1330" y="520" width="380" height="18" rx="9" fill="#00623A" fill-opacity=".55" class="ap" style="--t:3.20s"/><rect x="1330" y="570" width="330" height="18" rx="9" fill="#00623A" fill-opacity=".55" class="ap" style="--t:3.35s"/><rect x="1330" y="620" width="400" height="18" rx="9" fill="#00623A" fill-opacity=".55" class="ap" style="--t:3.50s"/><rect x="1330" y="670" width="260" height="18" rx="9" fill="#00623A" fill-opacity=".55" class="ap" style="--t:3.65s"/><path d="M1264 632 C1300 632 1300 578 1326 578" pathLength="1" class="dr" fill="none" stroke="#E8A33D" stroke-width="6" style="--t:4.0s;--d:.6s"/><g class="pp" style="--t:4.5s"><circle cx="1690" cy="820" r="40" fill="#00623A"/><path d="M1672 820 l12 12 l24 -26" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><rect width="1920" height="1080" filter="url(#g)" opacity=".08" style="mix-blend-mode:multiply"/></svg>