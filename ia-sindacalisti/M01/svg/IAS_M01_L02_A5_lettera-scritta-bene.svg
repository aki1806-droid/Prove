<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&amp;family=Inter:wght@400;600&amp;family=Barlow+Condensed:wght@700&amp;display=swap');
text{font-family:Inter,sans-serif} .t{font-family:Montserrat,sans-serif;font-weight:800} .n{font-family:'Barlow Condensed',sans-serif;font-weight:700}
@keyframes traccia{to{stroke-dashoffset:0}} @keyframes pop{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes appare{to{opacity:1}} @keyframes sale{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}} @keyframes svanisce{to{opacity:.15}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:traccia var(--d,1.4s) cubic-bezier(.65,0,.25,1) var(--t,0s) forwards}
.pp{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.ap{opacity:0;animation:appare .6s var(--t,0s) forwards} .sl{opacity:0;animation:sale .7s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.cr{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:cresce 1s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
.sv{animation:svanisce .8s var(--t,0s) forwards}
</style>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" fill="#E6F2EC"/><text x="160" y="170" class="t ap" font-size="56" fill="#2B2F2E" style="--t:.1s">La stessa lettera, scritta bene</text><path d="M260 560 H1660" pathLength="1" class="dr" stroke="#00623A" stroke-width="8" stroke-dasharray="1" style="--t:.4s;--d:3.2s"/><g class="pp" style="--t:0.6s"><circle cx="260" cy="560" r="80" fill="#00623A"/><rect x="232" y="522" width="56" height="76" rx="6" fill="#fff"/><rect x="244" y="540" width="32" height="6" fill="#00623A"/><rect x="244" y="556" width="32" height="6" fill="#00623A"/><rect x="244" y="572" width="22" height="6" fill="#00623A"/></g><text x="260" y="710" text-anchor="middle" class="t ap" font-size="32" fill="#2B2F2E" style="--t:0.9s">Contratto caricato</text><g class="pp" style="--t:1.4s"><circle cx="726" cy="560" r="80" fill="#00623A"/><text x="726" y="590" text-anchor="middle" class="t" font-size="84" fill="#fff">§</text></g><text x="726" y="710" text-anchor="middle" class="t ap" font-size="32" fill="#2B2F2E" style="--t:1.7s">Articolo e comma esatti</text><g class="pp" style="--t:2.2s"><circle cx="1192" cy="560" r="80" fill="#00623A"/><text x="1192" y="590" text-anchor="middle" class="t" font-size="84" fill="#fff">?</text></g><text x="1192" y="710" text-anchor="middle" class="t ap" font-size="32" fill="#2B2F2E" style="--t:2.5s">«Se non lo trovi, dimmelo»</text><g class="pp" style="--t:3.0s"><circle cx="1658" cy="560" r="80" fill="#0B3D2A"/><text x="1658" y="590" text-anchor="middle" class="t" font-size="84" fill="#fff">✓</text></g><text x="1658" y="710" text-anchor="middle" class="t ap" font-size="32" fill="#2B2F2E" style="--t:3.3s">Controllo sul testo</text><g class="sl" style="--t:4.2s"><rect x="660" y="820" width="600" height="90" rx="45" fill="#E8A33D"/><text x="960" y="878" text-anchor="middle" class="t" font-size="38" fill="#2B2F2E">Due minuti in più</text></g><rect width="1920" height="1080" filter="url(#g)" opacity=".08" style="mix-blend-mode:multiply"/></svg>