[project]
name = "anychat-mcp"
version = "0.1.0"
description = "Server MCP per pilotare AnyChat: contatti, campagne e invii WhatsApp"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
anychat-mcp = "anychat_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anychat_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
