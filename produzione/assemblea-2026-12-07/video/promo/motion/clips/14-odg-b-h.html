.rw{position:absolute;left:-380px;width:760px;height:104px;display:flex;align-items:center;gap:26px;white-space:nowrap}

<div data-slot="shape">
  <div class="L" id="Lo">
    <div class="a" style="left:-380px;top:34px;font-size:30px;font-weight:700;letter-spacing:.08em;color:var(--muted);white-space:nowrap">ORDINE DEL GIORNO · 6–10 DI 10</div>
    <div class="rw" id="r0" style="top:96px"><span class="nm" id="n0"></span><div><div class="tx">Incentivi funzioni tecniche</div></div></div>
    <div class="rw" id="r1" style="top:206px"><span class="nm" id="n1"></span><div><div class="tx">Andamenti occupazionali</div></div></div>

  </div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
const K=1.22;
const T=[0.39, 3.51, 5.99, 9.23, 11.87], N=6;
M.scene({
  W:1920,H:1080,T:14.0,bg:BRAND.canvas,center:[960,470],intro:0.02,
  SH:{a:{w:840,h:660,r:44,bg:BRAND.surface,cam:1.02*K}},
  start:'a',SEQ:[],
  layers:[{el:'Lo',tin:0.02,tout:null,anchor:'t',update:t=>{
    let cur=-1;T.forEach((c,i)=>{if(t>=c-0.05)cur=i;});
    T.forEach((c,i)=>{const r=$('r'+i),n=$('n'+i);M.apply(r,M.vis(t,c-0.25,null,{din:0,lin:0.22}));
      const act=i===cur, done=i<cur;
      n.style.background=act?BRAND.accent:(done?BRAND.strong:BRAND.panel);n.style.color=act?BRAND.on_accent:(done?BRAND.on_strong:BRAND.ink);
      M.setText(n,String(N+i));
      const s=act?1+0.06*Math.exp(-(t-c)*6):1; r.style.transform=`scale(${s.toFixed(3)})`;r.style.transformOrigin='0 50%';
      r.querySelector('.tx').style.opacity=(act||i>cur)?1:0.55;});
  }}],
});
</script>
