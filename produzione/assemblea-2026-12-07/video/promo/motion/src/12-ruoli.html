<script>
const $=id=>document.getElementById(id);
const K=__K__;
const CK=[0.4,1.55,2.95,3.7,4.5];
M.scene({
  W:__W__,H:__H__,T:7.9,bg:BRAND.canvas,center:[__CX__,__CY__],intro:0.02,
  SH:{list:{w:780,h:700,r:44,bg:BRAND.surface,cam:1.0*K},pill:{w:960,h:160,r:80,bg:BRAND.accent,cam:0.95*K}},
  start:'list',SEQ:[[5.6,'pill']],
  layers:[
    {el:'Llist',tin:0.02,tout:5.6,update:t=>{CK.forEach((c,i)=>{M.apply($('i'+i),M.vis(t,c-0.35,null,{din:0,lin:0.22}));
      const on=M.S(t-c,22,0.8),b=$('b'+i);b.style.background=on>0.5?BRAND.accent:BRAND.panel;
      b.innerHTML=on>0.02?M.icon('check',36,BRAND.on_accent,3):'';b.firstChild&&(b.firstChild.style.transform=`scale(${Math.max(0,on).toFixed(3)})`);});}},
    {el:'Lpill',tin:5.6,tout:null},
  ],
  cursor:{size:48,clicks:CK,keys:[[0,470,-300],[0.25,-300,-260],[0.45,-300,-260],[1.4,-300,-130],[1.6,-300,-130],[2.8,-300,0],[3.0,-300,0],[3.55,-300,130],[3.75,-300,130],[4.35,-300,260],[4.55,-300,260],[5.5,520,330],[7.9,540,340]]},
