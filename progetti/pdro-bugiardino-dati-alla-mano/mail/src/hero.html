<html><head><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Courier+Prime:wght@700&display=block');

.box .l{margin:4px 10px;height:7px;background:#e2ece6;border-radius:4px}
.timbro{position:absolute;right:62px;top:236px;border:4px solid #d7191f;color:#d7191f;font-weight:900;font-size:20px;padding:0 9px;border-radius:7px;transform:rotate(-10deg);background:rgba(255,255,255,.92);letter-spacing:1.5px}
.p{position:absolute;left:26px;top:216px;width:360px;font-size:13.5px;line-height:19px;font-weight:600;color:#2d4a3b}
.c{position:absolute;left:26px;top:282px;display:flex;gap:6px}
.c span{font-family:'Courier Prime';font-weight:700;font-size:12px;background:#06381f;color:#ffd60a;padding:5px 9px;border-radius:6px}
</style></head><body><div id="c"><div class="logo"><img src="logo.png"></div><div class="chip">✚ IL BUGIARDINO® · AOUP</div>

<div class="c"><span>FALSO</span><span>FALSO</span><span>INESATTO</span></div>
<div class="box"><div class="t">✚ BUGIARDINO®</div><div class="b"><small>compresse di</small>VERITÀ</div><div class="l"></div><div class="l" style="width:60%"></div><div class="l" style="width:80%"></div></div>
<div class="timbro">ATTENZIONE</div></div></body></html>
