<title>01 Capitolo + checklist (9:16)</title>
<style>
.it{position:absolute;left:-250px;display:flex;align-items:center;gap:22px;font-size:40px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;color:var(--ink)}
.bx{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
</style>
<div data-slot="shape">
  <div class="L" id="Lpill"><div class="row" style="transform:translate(-50%,-50%);gap:14px;color:var(--on-strong);font-size:40px;font-weight:500">Prossimo capitolo<span id="icA"></span></div></div>
  <div class="L" id="Lcap">
    <img id="logo" class="a" style="right:-250px;top:-150px;height:56px;width:auto;display:none" alt="">
    <div class="a" style="left:-250px;top:-150px;font-size:130px;line-height:130px;font-weight:600;letter-spacing:-.05em;color:var(--accent)">02</div>
    <div class="a" style="left:-248px;top:0px;font-size:62px;font-weight:600;letter-spacing:-.03em;color:var(--on-strong);white-space:nowrap">Perché funziona</div>
    <div class="a" style="left:-246px;top:84px;font-size:32px;color:var(--muted);white-space:nowrap">Tre cose da ricordare</div>
  </div>
  <div class="L" id="Llist">
    <div class="it" id="i0" style="top:-170px"><span class="bx" id="b0"></span>Un’idea per clip</div>
    <div class="it" id="i1" style="top:-30px"><span class="bx" id="b1"></span>Sempre sulla parola</div>
    <div class="it" id="i2" style="top:110px"><span class="bx" id="b2"></span>Niente dati inventati</div>
  </div>
</div><!--/shape-->
<script>
// Esempio verticale 9:16 in italiano, indipendente dal brand: usa solo i token (var(--…) nel CSS, BRAND.… nel JS)
// e resta nell'area sicura dei social. Cambiando brand (build.py --brand nome) cambia tutto il look senza toccare la clip.
const $=id=>document.getElementById(id);
$('icA').innerHTML=M.icon('arrow',36,BRAND.on_strong);
if(BRAND.logo){const l=$('logo');l.src=BRAND.logo;l.style.display='';}
const CHECK=[2.9,3.6,4.3];
M.scene({
  W:1080,H:1920,bg:BRAND.canvas,T:5.6,intro:0.1,
  center:[520,860],
  SH:{pill:{w:470,h:104,r:52,bg:BRAND.strong,cam:1.5}, cap:{w:620,h:420,r:52,bg:BRAND.strong,cam:1.35}, list:{w:660,h:520,r:48,bg:BRAND.surface,cam:1.3}},
  start:'pill', SEQ:[[0.9,'cap'],[2.2,'list']],
  layers:[
    {el:'Lpill',tin:0.1,tout:0.9,o:{din:0.03}},
    {el:'Lcap',tin:0.9,tout:2.2},
    {el:'Llist',tin:2.2,tout:null,update:(t)=>{
      CHECK.forEach((c,i)=>{const v=M.vis(t,c-0.5,null,{din:0,lin:0.3}); M.apply($('i'+i),v);
        const on=M.S(t-c,22,0.8); const b=$('b'+i); b.style.background=on>0.5?BRAND.accent:BRAND.canvas;
        b.innerHTML=on>0.02?M.icon('check',32,BRAND.on_accent,3):''; b.firstChild&&(b.firstChild.style.transform=`scale(${Math.max(0,on).toFixed(3)})`);});
    }},
  ],
  cursor:{size:52,clicks:CHECK,keys:[[0,700,500],[2.4,700,500],[2.75,-224,-144],[2.95,-224,-144],[3.45,-224,-4],[3.65,-224,-4],[4.15,-224,136],[4.35,-224,136],[5.6,-120,220]]},
});
</script>
